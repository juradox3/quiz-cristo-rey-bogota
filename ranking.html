<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranking - Hijas de Cristo Rey</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Ajustes ligeros para mejorar la visualización de los nuevos datos combinados */
        .ranking-page {
            background-color: #fafafa;
        }
        .meta-tag {
            display: inline-block;
            font-size: 11px;
            color: #64748b;
            background-color: #f1f5f9;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 3px;
            font-weight: 500;
        }
        .table-meta {
            font-size: 11px;
            color: #64748b;
            background-color: #f1f5f9;
            padding: 2px 6px;
            border-radius: 3px;
            margin-left: 8px;
            font-weight: normal;
        }
    </style>
</head>
<body class="ranking-page">
    <div class="ranking-container">
        <div class="ranking-header" style="text-align: center;">
            <img src="img/logo-colegio.png" alt="Colegio Cristo Rey" style="max-height: 70px; margin-bottom: 10px;" onerror="this.style.display='none'">
            <h1>Ranking de Participantes</h1>
            <p>150 años por Cristo y su Reino</p>
        </div>

        <div class="top-5-section">
            <h2 class="top-5-title">🏆 Top 5 Mejores</h2>
            <div class="ranking-list" id="top5List"></div>
        </div>

        <div class="all-participants">
            <h2 class="participants-title">Todos los Participantes</h2>
            <div class="participants-table" id="participantsTableContainer">
                <div class="table-header">
                    <div>POS</div>
                    <div>PARTICIPANTE / DEPENDENCIA</div>
                    <div>NOTA</div>
                </div>
                <div id="participantsList"></div>
            </div>
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="btn-back-home" onclick="window.location.href='index.html'">← VOLVER AL MENÚ PRINCIPAL</button>
        </div>
    </div>

    <script type="module">
        import { obtenerRanking } from "./js/firebase.js";

        async function loadRanking() {
            const top5List = document.getElementById('top5List');
            const participantsList = document.getElementById('participantsList');

            if(top5List) top5List.innerHTML = '<p style="text-align:center; color:#64748b; padding: 10px;">Cargando posiciones desde Firebase...</p>';
            if(participantsList) participantsList.innerHTML = '<div style="padding:20px; text-align:center; color:#64748b;">Cargando posiciones de Firebase...</div>';

            try {
                const sortedResults = await obtenerRanking();
                
                if(top5List) top5List.innerHTML = '';
                if(participantsList) participantsList.innerHTML = '';

                // Si no hay resultados todavía
                if (!sortedResults || sortedResults.length === 0) {
                    if(top5List) top5List.innerHTML = '<p style="text-align:center; color:#64748b;">No hay registros aún.</p>';
                    if(participantsList) participantsList.innerHTML = '<div style="padding:15px; text-align:center; color:#64748b;">No hay participantes registrados.</div>';
                    return;
                }

                // 1. Renderizado del Top 5 (Para las medallas y podios superiores)
                sortedResults.slice(0, 5).forEach((result, index) => {
                    // Controlamos que lea los campos correctos (userType o rol) y el cargo opcional
                    const infoRol = result.userType || result.rol || 'Participante';
                    const infoCargo = result.jobPosition || result.cargo || '';
                    const infoCompleta = infoCargo ? `${infoRol} (${infoCargo})` : infoRol;

                    top5List.innerHTML += `
                        <div class="ranking-item rank-${index + 1}">
                            <div class="rank-badge">${index + 1}</div>
                            <div class="ranking-info">
                                <div class="ranking-name" style="font-weight: 700; color: #0f2c59;">
                                    ${result.nombre || 'Anónimo'}
                                    <br><span class="meta-tag">${infoCompleta}</span>
                                </div>
                            </div>
                            <div class="ranking-score"><div class="score-value">${result.puntaje}%</div></div>
                        </div>
                    `;
                });

                // 2. Renderizado de la tabla general de posiciones de forma limpia e irrompible
                sortedResults.forEach((result, index) => {
                    const infoRolGeneral = result.userType || result.rol || 'Participante';
                    const infoCargoGeneral = result.jobPosition || result.cargo || '';
                    const infoMostrarTabla = infoCargoGeneral ? `${infoRolGeneral} - ${infoCargoGeneral}` : infoRolGeneral;

                    participantsList.innerHTML += `
                        <div class="table-row">
                            <div class="table-position">${index + 1}</div>
                            <div class="table-name" style="color: #1e293b; font-weight: 500;">
                                ${result.nombre || 'Anónimo'} <span class="table-meta">${infoMostrarTabla}</span>
                            </div>
                            <div class="table-percentage" style="font-weight: 700; color: #0f2c59;">${result.puntaje}%</div>
                        </div>
                    `;
                });

            } catch (error) {
                console.error("Error al cargar el ranking: ", error);
                if(participantsList) participantsList.innerHTML = '<div style="padding:15px; text-align:center; color:#ef4444;">Error al conectar con la base de datos.</div>';
            }
        }

        window.onload = loadRanking;
    </script>
</body>
</html>
